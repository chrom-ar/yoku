name: Deploy

on:
  push:
    branches:
      - master
  workflow_dispatch:

env:
  NODE_VERSION: '24.x'
  OUTPUT_DIR: 'dist'
  BUCKET: 'yoku.chrom.ar'

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Dependencies
        run: npm ci

      - name: Check
        run: npx astro check

      # The `prebuild` script renders the OG cards and the touch icon into
      # public/ before Astro copies it, so they ship with the build.
      - name: Build
        run: npm run build

      - name: Configure
        uses: aws-actions/configure-aws-credentials@v6
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-1

      - name: Deploy
        run: |
          # Everything under _astro/ is content-hashed, so it can be cached
          # forever. The --exclude/--include filters apply to the destination
          # too, so --delete only ever prunes within the set being synced.
          aws s3 sync ./${{ env.OUTPUT_DIR }}/ s3://${{ env.BUCKET }}/ \
            --delete \
            --cache-control "public, max-age=31536000, immutable" \
            --exclude "*" \
            --include "_astro/*"

          # Everything else keeps a stable path across deploys — the pages, the
          # OG cards and the icons — so it must revalidate.
          aws s3 sync ./${{ env.OUTPUT_DIR }}/ s3://${{ env.BUCKET }}/ \
            --delete \
            --cache-control "public, max-age=0, must-revalidate" \
            --exclude "_astro/*"

      - name: Cache
        run: |
          aws cloudfront create-invalidation \
            --distribution-id ${{ secrets.CLOUDFRONT_DISTRIBUTION_ID }} \
            --paths "/*"
